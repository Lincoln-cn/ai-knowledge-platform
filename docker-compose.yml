# ════════════════════════════════════════════════════════════════════════════
# 开发期部署形态：★ 2 个进程（PostgreSQL + 应用）—— 见 ROADMAP §4.6
# ════════════════════════════════════════════════════════════════════════════
#
# ★ 这里只起 PG，应用在本地跑（IDE 或 backend\mvn-jdk25.cmd spring-boot:run）。
#   为什么不上第二个容器：ROADMAP §4.6 的约束是"不要第三个中间件"（不引 Redis /
#   Nacos / MQ / MinIO），不是"应用必须容器化"。开发期把应用塞进容器，
#   代价是每次改代码都要重建镜像 —— 那是部署期才值得付的成本（09 §6.1）。
#
# ★ 也不需要 JAiRouter：Ollama 自带 OpenAI 兼容端点，应用直连 /v1 即可
#   （09 §3.13.5）。试用期换网关时只改 application.yml 的 base-url，零代码改动。
#
# 用法：
#   docker compose up -d      起 PG
#   docker compose ps         看状态
#   docker compose down       停（保留数据）
#   docker compose down -v    停并删数据卷 ★ 会清空所有数据
# ════════════════════════════════════════════════════════════════════════════

services:
  postgres:
    # ★ 必须用 pgvector 镜像而不是官方 postgres：
    #   V1 迁移里的 CREATE EXTENSION vector 靠它。若换成官方镜像，
    #   迁移会失败并直接指出这一点 —— 这正是把扩展安装放在第 1 周的价值。
    #   ★ 这条约束现在升级成一张**自制镜像**（理由见下）：
    #     设计册 `09 §10.2 #3` 定的中文全文检索是 `to_tsvector('chinese_zh', …)`，
    #     而 `chinese_zh` 的 parser 只能是 **zhparser**（用 `simple` 会把**整段中文
    #     当成一个 token**，症状是"全文检索一条都搜不到"）。实测本 base 镜像里
    #     `pg_available_extensions` 没有 zhparser，PGDG / Debian 也没有现成包。
    #   ★ 它**仍然是 pgvector 镜像**：`deploy/pg/Dockerfile` 两段式都拿
    #     `pgvector/pgvector:pg16` 当 base ⇒ `vector` 是 base 原封不动那一份
    #     （`deploy/verify_image_pg.py` 里有一条断言专门钉这件事）。
    image: ai-knowledge-platform-pg:dev
    # ★ 写 build: 是为了 `docker compose up -d` 开箱即用（首次编译 scws + zhparser，
    #   约几分钟，之后走缓存）。★ CI 里另有一条**显式** build —— GitHub 的
    #   **service 容器不能 build**，所以真栈 job 改成"先 build、再用 docker run 起"。
    build:
      context: .
      dockerfile: deploy/pg/Dockerfile
    container_name: aip-postgres
    environment:
      POSTGRES_DB: aiplatform
      POSTGRES_USER: aiplatform
      POSTGRES_PASSWORD: aiplatform
    ports:
      # ★ 宿主端口默认 15432 而不是 PG 标准的 5432 —— 不是随手选的：
      #   本机 Windows 的保留端口段（netsh int ipv4 show excludedportrange protocol=tcp）
      #   包含 5281-5380，5432 正在其中，于是 Docker 绑定会失败：
      #   "bind: An attempt was made to access a socket in a way forbidden by its access permissions"。
      #   用标准 5432 的机器：设 AIP_DB_PORT=5432 再 up，或把这里改回去。
      - "${AIP_DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiplatform -d aiplatform"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ──────────────────────────────────────────────────────────────────────────
  #  模型服务（Ollama）—— ★ 默认不启动，要加 --profile ollama
  #
  #  为什么用 profile 而不是默认起：ROADMAP §4.6 定的开发期形态是"2 个进程
  #  （PG + 应用）"，而 Ollama 是**外部依赖**，不是平台自己的进程
  #  （09 §3.13.5 的表里它就单列成"Ollama 的 /v1"那一列）。
  #  设成默认服务会让"开发期 2 进程"这句话失效，也会让只想跑单测的人白等一次容器启动。
  #
  #  用法：
  #    docker-compose --profile ollama up -d       起 PG + Ollama
  #    docker-compose exec ollama ollama pull <模型>   拉模型
  #    docker-compose exec ollama ollama list          看已拉到的模型
  #
  #  ★ 模型数据落在项目内的 ./.ollama-data（已 ignore），而不是 Docker 命名 volume：
  #    本机 C 盘只剩 ~24GB，而命名 volume 默认在 C 盘；项目在 D 盘，放这里更安全。
  #  ★ 本机 nvidia-smi 初始化失败（NVML Unknown Error）⇒ 走 CPU 推理，故不配 GPU 段。
  #    有可用 GPU 时再按 ollama 官方文档加 deploy.resources.reservations.devices。
  # ──────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: aip-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ./.ollama-data:/root/.ollama
    environment:
      # 模型在内存里驻留多久。探针会连发几十次请求，默认 5m 会让它反复重新加载
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-15m}

volumes:
  pgdata:
