name: 真栈 · 端到端闸门

# ══════════════════════════════════════════════════════════════════════════════
#  本文件是原 `ci.yml` 的**第四块**（2026-10-17 拆分）。
#
#  ★ 其余三块分别住在这里：
#      · `ci-fast.yml`            —— 后端编译 + spotless + 前端 typecheck + 静态闸门（目标 <3 分钟）
#      · `ci-backend.yml`         —— 架构/口径闸门（先跑，不要 DB）+ 整包 `mvn verify`（871 秒那块）
#      · `ci-frontend-gates.yml`  —— 11 个确定性浏览器闸门（193 秒）
#      · `ci-frontend-build.yml`  —— mock 构建 + dist 冒烟（118 秒）
#
#  ★ 为什么真栈单独一条 workflow（原文件里就有这条理由，照抄）：
#    失败时一眼能看出「是真栈的问题，还是界面的问题」。
#    ★ 四条 workflow **互不 `needs`**：任一侧红都各自报出来，互不遮蔽。
#
#  ★ 真栈这一块实测 6 分 17 秒，其中 `真栈闸门（逐条记账）` 一步 261 秒；
#    其余 128 秒全是**起环境**（PG 镜像 9s · 后端 jar 25s · 起后端 15s · 前端依赖 10s ·
#    playwright 20s · OCR 10s）。★ 所以它没法再"拆快"——除非把环境做成可复用镜像，
#    而那会把"真栈"变成"半真栈"，不值。
# ══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: realstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  #  真栈 · 五条端到端闸门（issue #3）
  #
  #  ★ 这个 job 回答的是本项目最关键的那句判据：「真链路能跑吗」。
  #
  #  在它之前，那五条闸门只在开发机上手工跑 —— 换台机器、换个人就没人知道这些流程还通不通；
  #  而 mock 长期比真后端宽松（`docs/已知问题与欠账.md` A3 的假绿灯就是这么来的）。
  #  实测代价：编排画布整页不可用（#20）在 main 上活了 6 天，因为在 CI 里根本没有一条真栈闸门会去点它。
  #
  #  ★ 与 frontend job 分开的理由：失败时一眼能看出「是真栈的问题，还是界面的问题」。
  #    不设 `needs:` —— 与后端 job 并行跑，任一侧红都各自报出来，互不遮蔽。
  #
  #  ★ 这里刻意**不跑 mock 模式**：`VITE_USE_MOCK=false` + `VITE_API_TARGET` 指向真后端。
  # ══════════════════════════════════════════════════════════════════════════════
  realstack:
    name: 真栈 · 端到端闸门
    runs-on: ubuntu-latest
    # ★ 实测 6 分 17 秒；给 30 分钟上限。
    #   ★ 补这一条的理由：本文件拆出来之前，整条 ci.yml **没有一处 `timeout-minutes`** ——
    #     卡住时会占满 GitHub 默认的 6 小时。那不只是慢，它会把同一并发组里的后续运行**挤掉**
    #     （`ci.yml` 原来是单文件三 job，一个卡住会连累另两个的排队）。
    timeout-minutes: 30

    # ★ 这个 job **没有** `services:` 了 —— 原来起的 `postgres` 是官方 pgvector 镜像，
    #   而现在 PG 必须是自制镜像（pgvector + zhparser），GitHub 的 **service 容器只能拉
    #   现成镜像、不能 build** ⇒ 改成"先 build、再用 docker run 起"（下面两步）。
    #   ★ 代价：这几步的**顺序**变成了正确性的一部分（PG 必须先于后端起来）。
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建 PG 镜像（自制：pgvector + zhparser）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pg/Dockerfile
          tags: ai-knowledge-platform-pg:dev
          load: true
          cache-from: type=gha,scope=pg-zhparser
          cache-to: type=gha,scope=pg-zhparser,mode=max

      # ★ 等"真的能接受连接"再往下：只等端口会拿到"容器在起但还没接受连接"，
      #   后端起不来时表现为 Flyway 连接被拒，看起来像迁移坏了 ——
      #   这条原来是 service 的 healthcheck 在管，换成 docker run 后必须自己写。
      # ★ 顺带把 `pg_extension` 打出来：它是"这张镜像到底对不对"的唯一显式事实。
      - name: 起真 PG
        run: |
          docker run -d --name aip-pg -p 5432:5432 \
            -e POSTGRES_USER=aiplatform \
            -e POSTGRES_PASSWORD=aiplatform \
            -e POSTGRES_DB=aiplatform \
            ai-knowledge-platform-pg:dev
          for i in $(seq 1 60); do
            if docker exec aip-pg pg_isready -U aiplatform -d aiplatform > /dev/null 2>&1; then
              echo "PG 就绪（第 ${i} 次探测）"
              docker exec aip-pg psql -U aiplatform -d aiplatform -tAc \
                "select extname from pg_extension order by extname"
              exit 0
            fi
            sleep 2
          done
          echo "★ PG 起不来 —— 后面六条闸门会全以连接被拒失败，那不是页面的问题。日志："
          docker logs aip-pg
          exit 1

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ★ 与 backend job 同样的三个包（理由见那里的注释）：官方 tesseract-ocr 只带 eng。
      #   真栈 job 尤其需要它 —— 它是唯一会去点「上传扫描件 → 已识别 N/M 页」这条链的地方。
      - name: 装 OCR 引擎与语言包
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
          tesseract --list-langs

      - name: 起 OpenAI 桩服务（向量化与模型目录都打它）
        working-directory: backend
        run: |
          python tools/openai_stub.py --port 11434 > /tmp/stub.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/v1/models > /dev/null; then
              echo "桩服务就绪"
              exit 0
            fi
            sleep 1
          done
          echo "★ 桩服务起不来 —— 向量化会全线失败。日志："
          cat /tmp/stub.log
          exit 1

      - name: 构建后端 jar
        working-directory: backend
        run: mvn -B -q -DskipTests package

      # ★ 用 `--app.security.captcha.enabled=false` 起：闸门要能在没有任何人工的情况下跑完
      #   （验证码是给人看的）。生产不许关，这里关的是**测试实例**。
      # ★ DB_URL 显式给：application.yml 的默认值是为本地 15432 写的占位值。
      - name: 起真后端
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/aiplatform
          DB_USER: aiplatform
          DB_PASSWORD: aiplatform
        run: |
          # ★ 不写死版本号：pom 的 version 是发布切点，会随周次前进（0.4.5 …），
          #   写死只会在下一次版本对齐时把闸门变成"找不到 jar"。
          JAR="$(ls target/ai-knowledge-platform-*.jar | head -n 1)"
          echo "起 jar：$JAR"
          java -jar "$JAR" \
            --app.security.captcha.enabled=false > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "Started AiPlatformApplication" /tmp/backend.log; then
              echo "后端就绪（第 ${i} 次探测）"
              # ★ 顺带把 OCR 那一行打出来：它是"这台机器能不能 OCR"的唯一显式事实
              grep -E "OCR 引擎|OcrEngine" /tmp/backend.log || echo "（日志里没有 OCR 那一行 —— 留意是不是旧产物）"
              exit 0
            fi
            sleep 2
          done
          echo "★ 后端起不来 —— 后面五条闸门会全以连接被拒失败，那不是页面有问题。日志："
          cat /tmp/backend.log
          exit 1

      # ★ 真栈前端：覆盖 .env.development 里的 VITE_USE_MOCK=true 与错端口 18088。
      #   这两个默认值是"后端未就绪时走 mock"的遗留，不覆盖就会拿 mock 当"真栈证据"。
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 起真栈 dev server
        working-directory: frontend
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_TARGET: http://127.0.0.1:8080
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5280 > /dev/null; then
              echo "dev server ready after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "★ dev server 起不来。日志："
          cat /tmp/vite.log
          exit 1

      # ★ 再等一拍：vite 首次访问才编译，curl 通只代表端口在听（理由同 frontend job）
      - name: 预热首页
        run: |
          curl -s http://localhost:5280 > /dev/null
          curl -s http://localhost:5280/login > /dev/null
          sleep 5

      # ★ 与 frontend job 一样用 chromium + channel=chrome（runner 镜像自带 Chrome）
      - name: 装 playwright 浏览器
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # ★ check_segmentation_e2e.py 要**直接查库**：界面显示的是视图，库里的列才是入库链路的真相
      #   （search_text 有没有前缀、content_hash、embedding_status、进度列）。
      #   ★ CI 里的 PG 现在是 `docker run` 起的容器（名字 `aip-pg`），本机是 `aip-postgres`
      #     —— 名字不同 ⇒ 闸门**不走 `docker exec`**，用 psql 直连（连接由下面的 PG* 环境变量给，
      #     闸门自己会把它打进日志）。这样同一份闸门在本机与 CI 都成立。
      - name: 装 psql 客户端
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      # ★ 逐条记账，不遮蔽（理由见 frontend job 的浏览器闸门那一步）
      # ★ PG* 是给 check_segmentation_e2e.py 的：它读的库必须与后端写的库是同一个 ——
      #   不一致时它会立刻报「库里查不到刚上传的文档」并把连接打出来（以前会表现成"入库没生效"，指错方向）
      # ★ check_ocr_e2e.py（T249.4）走**界面**验扫描件那条链：上传 ⇒ 界面上「已识别 N/M 页」⇒ 入库成功，
      #   且文本型文档不出现进度行。它需要 tesseract（本 job 已装）+ 扫描件夹具。
      # ★ 第 11 周加 check_classification_e2e.py：同一份文档传成 PUBLIC/SECRET 两份，逐账号问一遍
      #   —— 它验的是「令牌里的 clearance 有没有真的进 SQL」，那条路只有从登录开始走才验得到。
      # ★ 第 12 周加 check_query_understanding_e2e.py：它自己注册并加载一个对话模型（夹具的一部分），
      #   然后断言埋点里的 M 子问题 × N 查询。★ 两条都**自己造夹具**，不依赖别的闸门留下的数据。
      # ★ 第 14 周加 check_multihop_e2e.py：难例（答案跨两段）跑**对照**——关多跳够不着答案、开多跳捞得回来。
      #   它还要桩支持 `entity_override`（让判定回"不够 + 下一轮查什么"），否则桩按 schema 给的占位值
      #   恒为 sufficient=true ⇒ 多跳永远停在第 1 轮，闸门会绿在一个什么都没验的状态上。
      #   ★ 计数不再写死在名字里：它已经在三处漂过（步骤名写"八条"、脚本里写"六条"），
      #     所以下面由数组长度算出来。
      - name: 真栈闸门（逐条记账）
        working-directory: frontend
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: aiplatform
          PGPASSWORD: aiplatform
          PGDATABASE: aiplatform
        run: |
          # ★ S1 的**整链**（MVP · ROADMAP §2.1）：**从空库起**一条命令跑完 ——
          #   建库（先断 documentCount==0）→ 上传真实字节 → 解析 → 切分预览与入库**同源**（段数相等）
          #   → 显式向量化（**读到过中间进度**，不是只看终态）→ 命中测试有引用且引用落到本文件
          #   → 停用分段后**不命中** → 重新启用后**又命中**。★ 它自己造库造模型，且 finally 里
          #   逐件删干净（含把桩的 delay_ms 复位 0）—— 本 job 的闸门顺序跑，泄漏夹具会污染后面每一条。
          #   台账里 S1 在它之前只有"三段各自有脚本"，没有一条把它们串起来的读数。
          gates=(check_s1_knowledge_chain_e2e \
                   # ★ S3 的**整链**（MVP · ROADMAP §2.1）：在**一个会话**里跑完七件事 —— 流式作答 →
                   #   引用先于正文且按 segmentId 真能读回内容 → 连续追问 5 轮（都落在同一个会话里）→
                   #   生成中停止（终态 STOPPED、不发 error、已生成的字一个不少地留在库里）→ 重新生成
                   #   覆盖同一条 → 赞/取消赞刷新后仍在 → 会话评分是覆盖不是追加。
                   #   ★ 「生成中停止」要有中间态，而桩默认把正文一次 flush 全到 ⇒ 本条靠桩的
                   #   chunk_delay_ms 注入帧间延迟（delay_ms 做不到：它只推迟开始），用完必须复位 0 ——
                   #   同 job 后面的闸门共用这一个桩。
                   check_s3_conversation_chain_e2e \
                   # ★ 跨场景整链（A1 的唯一缺口，2026-10-31 加）：S1 建的库 → S2 绑库的应用 →
                   #   S3 会话里的引用，断言引用三元组里的 kbId **就是** S1 那个库、segmentId 回读
                   #   200 且属于那份文档。三条链各自有读数 ≠ 三条链接得上 —— 这一条测的是"接得上"。
                   check_cross_scenario_e2e \
                 check_knowledge_parse check_knowledge_form check_segmentation_e2e \
                 check_document_actions check_flow_walkthrough check_ocr_e2e \
                 check_classification_e2e check_query_understanding_e2e \
                 check_multihop_e2e \
                   # ★ S2 的公开链接端到端（MVP · ROADMAP §2.1）：五条判据 —— 未登录解析（应用名 + 冻结密级）
                   #   → 提问带引用 → ★ **绑定的提示词正文真的进了上游 prompt**（读桩的
                   #   `GET /__stub/requests`：API 回执/界面/库里都只证明"绑了"，只有上游请求能证明"用了"，
                   #   这正是 `#215` 的端到端读数）→ 撤销后立即失效 → 撤销前那次成功是对照。
                   #   ★ 它自己造库、造模型、造提示词（不再借别的闸门留下的库：本 job 的闸门顺序跑、
                   #   每条 finally 都删干净，借库的下场是"夹具先红"），finally 逆序删回去。
                   check_public_share_e2e \
                   # ★ A4 的**浏览器侧**（MVP · ROADMAP §2.2）：引用能点开、点得到 ——
                   #   引用带齐 segmentId/documentId/kbId（缺 kbId 时界面把它判成会话域、按钮会消失）
                   #   → 按 segmentId 能回读原文且落在同一篇文档 → 面板标签是「知识库：」
                   #   → ★ **点「回到原句」那张卡要进入 active 态**（本闸门前这枚按钮是装饰：
                   #     组件 emit 了、页面没监听，点了什么都不发生也不报错 —— `#91` 同族）
                   #   → 点「跳转到分段管理」要落到 `/knowledge` 且 query 带 doc/segment/kb、
                   #     并出现「已按引用定位到分段」或「无法定位」的可读提示（静默跳首页不算）
                   #   → 控制台无错误。★ 它的角标那一半依赖桩在正文里标 `[N]`（见 openai_stub 的
                   #   `_answer_text`），没有角标时只记注记不判红 —— 那是"模型没标出处"的另一条账。
                   check_refs_jump_e2e \
                   # ★ S3 的重新生成（MVP · ROADMAP §2.1）：必须接住 targetMessageId。
                   #   修好之前这条链是**静默坏**的（后端无 mode 字段 ⇒ Jackson 忽略 ⇒ 按 NEW 走 ⇒
                   #   点「重新生成」新增一问一答，而界面看起来完全正常）。
                   check_regenerate_e2e \
                   # ★ A2 的**浏览器侧**（MVP · ROADMAP §2.2）：刷新页面不重置。
                   #   读侧已有 JUnit（ConversationStateSurvivesReloadTest）；这一条管的是
                   #   「路由重建 → 重新拉历史 → 渲染」那两步 —— 它们坏了而服务层是对的时，
                   #   用户看到的就是"刷新后对话空了"。
                   check_reload_keeps_state_e2e \
                   # ★ A3 的**界面侧**（MVP · ROADMAP §2.2）：失败可见（可读原因 + 可重试）。
                   #   ★ 用桩自己的注入口（`POST /__stub/config {fail_rate:1.0}`）造真实失败，
                   #     不 mock 后端、不碰产品代码；★ 且**必须在 finally 里复原** ——
                   #     本 job 的闸门是顺序跑的，泄漏的 fail_rate 会让后面每一条都红。
                   check_failure_visible_e2e \
                   # ★ B4 + B5（MVP · ROADMAP §2.3）：首字 ≤10s、完整响应 ≤60s。
                   #   ★ **两条判据共用一次请求**（同一次请求的两个时间戳）：拆成两个脚本的话，
                   #     "两次测量之间的差"会混进读数，而这里量的是同一次请求内的两个时刻。
                   #   ★ 为什么它值得进 CI：`#62` 刚把流式从网关换到 `ChatClient`（advisor 链的挂点），
                   #     首字延迟是唯一能证明"换完之后没有变慢"的读数 —— 功能闸门全绿也可能慢了 3 倍。
                   #   ★ 判据取 max 不取平均（§二 写的是上限）；1 轮冷启动 + 3 轮热态。
                   #   ★ B6（150 段）/ B7（200 次）**暂不并入**：一次引入三条重闸门会让本 job 同时红三处，
                   #     定位不了是哪条链坏的。等这条在 CI 站稳再谈（脚本已在仓库里，可手动跑）。
                   check_b4_b5_latency)
          failed=()
          for g in "${gates[@]}"; do
            echo "::group::${g}.py"
            if python "${g}.py"; then
              echo "✓ ${g}.py 通过"
            else
              echo "::error::${g}.py 失败"
              failed+=("${g}.py")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "★ 失败 ${#failed[@]}/${#gates[@]}：${failed[*]}"
            exit 1
          fi
          echo "全部 ${#gates[@]} 条真栈闸门通过"

      # ★ 真栈红的时候，日志就是唯一的证据 —— 不留就等于让人去猜（本 job 第一次进 CI 时用过它）
      # ★ PG 现在是容器而不是 service ⇒ 它的日志不自动出现在 job 输出里，必须自己捞。
      - name: 失败时留 PG 日志
        if: failure()
        run: docker logs aip-pg > /tmp/pg.log 2>&1 || true

      - name: 失败时留真栈日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: realstack-logs
          path: |
            /tmp/backend.log
            /tmp/vite.log
            /tmp/stub.log
            /tmp/pg.log
            frontend/screenshots/
          if-no-files-found: ignore
