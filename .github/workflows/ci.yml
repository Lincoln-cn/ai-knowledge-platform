name: CI

# ★ 每一道闸门都必须能在"没有任何人工"的情况下跑完 —— 这是"每周算发布"判据 3
#   （四道回归全绿）的前提，见 ROADMAP §4.7.1。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 编译 + 四类闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ★ 版本线：Temurin 25（09 §4.1）。本机是靠 backend\mvn-jdk25.cmd 钉的，
      #   CI 里由 setup-java 提供 —— 两条路都指向同一个 JDK，避免"本地过了 CI 挂"。
      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ★ 先起 OpenAI 桩服务，否则 OpenAiStubContractTest 会整体跳过 ——
      #   那 6 条里有两条是"框架有没有把 reasoning_effort 发出去""base-url 打得对不对"
      #   这类真证据，跳过它等于让这条回归在 CI 里静默失效。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 起 OpenAI 桩服务（供契约测试用）
        working-directory: backend
        run: |
          python tools/openai_stub.py --port 11434 > /tmp/stub.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/v1/models > /dev/null; then
              echo "桩服务就绪"
              exit 0
            fi
            sleep 1
          done
          echo "★ 桩服务起不来 —— 契约测试会因此被跳过。日志："
          cat /tmp/stub.log
          exit 1

      # ★ OCR 引擎与语言包必须装，否则 OcrParserTest（5 条）与 OcrEngineTest 里
      #   依赖真引擎的两条会**整体 assumeThat 跳过** —— CI 显示绿，而扫描件识别
      #   **没有任何回归在守**（issue #2）。
      # ★ 三个包都要列：官方 `tesseract-ocr` **只带 eng**，漏了 `tesseract-ocr-chi-sim`
      #   会让中文退化成方块/乱码 —— 而且不报错、不影响启动，是部署期最不可见的一类漏装。
      #   （`deploy/README.md` §三 的离线交付清单里，这三行与镜像是同源的。）
      - name: 装 OCR 引擎与语言包
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
          echo "已装："
          tesseract --version | head -1
          tesseract --list-langs

      # ★ 自制 PG 镜像（pgvector + zhparser）—— 集成测试（Testcontainers）靠它。
      #   设计册 `09 §10.2 #3` 的中文全文检索是 `to_tsvector('chinese_zh', …)`，
      #   而 `chinese_zh` 的 parser 只能是 zhparser；实测 pgvector 官方镜像里没有它、
      #   PGDG/Debian 也无现成包 ⇒ 只能自己编译（`deploy/pg/Dockerfile`）。
      #   ★ 带 GHA 层缓存：SCWS + zhparser 的编译只在缓存失效时发生（首次约 3–4 分钟，
      #     之后是命中缓存）。★ 这里放 buildx + build-push-action 而不是 `docker build`，
      #     就是为了拿到这份跨运行的缓存。
      - uses: docker/setup-buildx-action@v3

      - name: 构建 PG 镜像（自制：pgvector + zhparser）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pg/Dockerfile
          tags: ai-knowledge-platform-pg:dev
          load: true
          cache-from: type=gha,scope=pg-zhparser
          cache-to: type=gha,scope=pg-zhparser,mode=max

      # ★ 镜像自己的闸门（11 项）在"用镜像之前"跑：pgvector 真功能（建表/HNSW/余弦排序）、
      #   zhparser 精确分词（`'合同':1 '违约金':2`）、`simple` 对照、已知上限金丝雀、
      #   以及"交付镜像里没有 gcc/git"。镜像坏了必须在这里红，而不是伪装成"测试坏了"。
      - name: PG 镜像自检
        run: python deploy/verify_image_pg.py

      # 四类闸门一次跑完：单测 / 集成（Testcontainers 真 PG）/ 架构（Modulith verify + 金丝雀）/ 格式化。
      # ★ GitHub 的 ubuntu runner 自带 Docker，Testcontainers 可直接用。
      - name: mvn verify
        working-directory: backend
        run: mvn -B verify

      # ★ 零用例闸门：`Tests run: 0` 一律按失败处理（Issue #53 判据 ① / #50 判据 ②）。
      #   形态：`@BeforeAll` 里的 `assumeThat` 不成立 ⇒ JUnit **中止整个容器** ⇒ surefire 打出的正是
      #   `Tests run: 0, Failures: 0, Errors: 0, Skipped: 0` + `BUILD SUCCESS` —— 不含 skip、不含失败、纯绿。
      #   2026-10-11 实测：桩（11434）没起时 8 个依赖它的类全部以这种形态"绿"着（见 Issue #53）。
      #   本 job 的桩在上面那一步已经起了（起不来会直接红），所以这些类**本该跑起来**：
      #   真出现 `Tests run: 0` 就是真问题，不是环境噪声。
      #   扫 surefire 报告目录（CI 每次全新 ⇒ 不存在"上一次留下的旧报告"）。
      - name: 零用例闸门
        run: python tools/check_zero_tests.py backend/target/surefire-reports

      - name: 失败时留测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端 · 闸门 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ★ 必须在跑 python 脚本之前：runner 上只有 python3，
      #   而这些脚本全部以 `python xxx.py` 的方式被调用
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      # ── 第一组：不需要 dev server。这四个是真正的纯静态闸门 ──
      - name: 静态闸门
        working-directory: frontend
        run: |
          python verify_refs.py
          python check_template_tags.py
          python check_design.py
          # ★ 错误码一致性（issue #8）：契约 ↔ 后端枚举 ↔ mock 三处逐值核对。
          #   这条拦的是"两边各写一份取值、没人核"——mock 曾自造 4001–4006 与 40404/30xx，
          #   而后端一律返契约里的码，前端当时又不按码分支 ⇒ 完全看不见的分歧。
          python check_error_codes.py
          # ★ 画布节点类型（issue #20/#21）：注册名必须是契约取值，不是目录名的 kebab 形态。
          #   #20 就是"注册名 start-node vs 契约 START_NODE" ⇒ 画布整页不可用、活了 9 天。
          #   真栈那五条闸门全在知识库域，画布只有 mock 在守 ⇒ 这一类必须在静态层钉住。
          python check_workflow_node_types.py

      # ── 第二组：需要 dev server + 浏览器 ──
      # ★ 实测结论（2026-09，本机两遍）：这 19 个 .py 里有 16 个 import playwright，
      #   其中 14 个（3 个纯静态 + 11 个浏览器）两遍结果**完全一致**，可以当确定性闸门用；
      #   另外 3 个当前 flaky，**故意不放在这里**（理由见下面的注释）。
      - name: 装 playwright 浏览器（Python 侧）
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 起 dev server 并等就绪
        working-directory: frontend
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5280 > /dev/null; then
              echo "dev server ready after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "★ dev server 起不来 —— 后面所有浏览器闸门都会以 ERR_CONNECTION_REFUSED 失败，"
          echo "  那不是页面有问题，是基础设施没就绪。日志："
          cat /tmp/vite.log
          exit 1

      # ★ 等就绪之后还要再等一拍：vite 是**首次访问才编译**，
      #   curl 通只代表端口在听。实测在这一拍上踩过：verify_permissions 冷启动时报
      #   "49/50"，热了之后是 "49/49" —— 数字不同不是代码变了，是页面还没编译完。
      - name: 预热首页（触发 vite 首次编译）
        run: |
          curl -s http://localhost:5280 > /dev/null
          curl -s http://localhost:5280/login > /dev/null
          sleep 5

      # ★★ 逐条跑完并记账，**不让第一个失败遮蔽其余**（issue #19）。
      #
      #   这些闸门是互相独立的信号。用 shell 的 `set -e`（GHA 默认）串起来，等于
      #   "第一个坏了就再也看不到后面 10 条" —— 实测代价：2026-09-28 起 `check_nodeconfig.py`
      #   超时，于是 check_node_menu / check_canvas / … 共 9 条**连续一周多从没在 CI 里执行过**，
      #   工作流里却写着"11 个确定性闸门"。那也是一种"看起来在做、实际没生效"。
      #
      #   ★ 判据没有弱化：任一条红，这一步最后照样 exit 1。变的是"红的时候能不能看见全貌"。
      - name: 浏览器闸门（11 个确定性闸门）
        working-directory: frontend
        run: |
          failed=()
          for g in check_theme check_nodeconfig check_node_menu check_canvas check_collapse \
                   check_history check_palette check_pickers check_assistants check_singleton \
                   check_publish; do
            echo "::group::${g}.py"
            if python "${g}.py"; then
              echo "✓ ${g}.py 通过"
            else
              echo "::error::${g}.py 失败"
              failed+=("${g}.py")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "★ 失败 ${#failed[@]}/11：${failed[*]}"
            exit 1
          fi
          echo "11 个浏览器闸门全部通过"

      # ── 第三组：自带静态服务器 serve `dist/` 的两个闸门（issue #14）──
      #
      # ★ 它们在 42xx 端口上自己起 http.server 服务 `dist/`，所以**必须在 build 之后**跑。
      #
      # ★ 这两条此前被排除在 CI 之外，理由是"断言总数在变 ⇒ 随机变红"。本轮按实测修掉了：
      #     · verify_features.py —— 实测的时序是：填弱口令 +100ms 出校验文案；
      #       改填合格口令后旧文案**要到 +300ms 才消失**。原先读一次（固定 900ms）在 CI 上不够。
      #       改成「等文案静默 400ms 再读」（> 实测的 300ms 转换窗口）⇒ 之后 11 轮连续全绿。
      #     · smoke_test.py —— 原先稳定红 1 条（32/33），而那不是 flaky，是**真缺陷**：
      #       模型列表的「类型」筛选选项值是 `chat`/`embedding`，而 mock 与后端都比 SCREAMING_SNAKE
      #       ⇒ 选「向量模型」恒筛出 0 条（issue #23）。修完是 34/34。
      #       ★ 这条闸门抓出了真缺陷却没人知道 —— 因为它不在 CI 里。这正是 #14 的代价。
      - name: 类型检查 + 构建（mock 模式）
        working-directory: frontend
        run: npm run build:mock

      - name: 功能点 / 冒烟闸门（自带 dist 服务）
        working-directory: frontend
        run: |
          failed=()
          for g in verify_features smoke_test; do
            echo "::group::${g}.py"
            if python "${g}.py"; then
              echo "✓ ${g}.py 通过"
            else
              echo "::error::${g}.py 失败"
              failed+=("${g}.py")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "★ 失败 ${#failed[@]}/2：${failed[*]}"
            exit 1
          fi
          echo "两条闸门全部通过"

      # ⚠️ 仍然**故意不接入** CI 的一个闸门：
      #
      #   verify_permissions.py —— 权限矩阵。本轮已修掉一处确定的时序问题
      #     （登录后固定等 1600ms 就断言 URL 变了 → 改成 `wait_for_url` 等真的离开登录页），
      #     但**仍有约 1/8 的偶发**：报「仍停在 /#/login」且等 20s 也不跳转，
      #     而现场（值已填对、无报错文案、无控制台错误）看不出原因，本机探针单独连登 8 次是 8/8 干净。
      #   ⇒ 没弄清之前不接进来：随机红比不红更坏（报红会有人去改本来没错的东西）。
      #     下一次它红的时候，失败信息里会带上现场（输入框值 / 验证码控件数 / 提示气泡 / 表单校验文案），
      #     那时就能定因。跟踪：issue #14。

  # ══════════════════════════════════════════════════════════════════════════════
  #  真栈 · 五条端到端闸门（issue #3）
  #
  #  ★ 这个 job 回答的是本项目最关键的那句判据：「真链路能跑吗」。
  #
  #  在它之前，那五条闸门只在开发机上手工跑 —— 换台机器、换个人就没人知道这些流程还通不通；
  #  而 mock 长期比真后端宽松（`docs/已知问题与欠账.md` A3 的假绿灯就是这么来的）。
  #  实测代价：编排画布整页不可用（#20）在 main 上活了 6 天，因为在 CI 里根本没有一条真栈闸门会去点它。
  #
  #  ★ 与 frontend job 分开的理由：失败时一眼能看出「是真栈的问题，还是界面的问题」。
  #    不设 `needs:` —— 与后端 job 并行跑，任一侧红都各自报出来，互不遮蔽。
  #
  #  ★ 这里刻意**不跑 mock 模式**：`VITE_USE_MOCK=false` + `VITE_API_TARGET` 指向真后端。
  # ══════════════════════════════════════════════════════════════════════════════
  realstack:
    name: 真栈 · 八条端到端闸门
    runs-on: ubuntu-latest

    # ★ 这个 job **没有** `services:` 了 —— 原来起的 `postgres` 是官方 pgvector 镜像，
    #   而现在 PG 必须是自制镜像（pgvector + zhparser），GitHub 的 **service 容器只能拉
    #   现成镜像、不能 build** ⇒ 改成"先 build、再用 docker run 起"（下面两步）。
    #   ★ 代价：这几步的**顺序**变成了正确性的一部分（PG 必须先于后端起来）。
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建 PG 镜像（自制：pgvector + zhparser）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pg/Dockerfile
          tags: ai-knowledge-platform-pg:dev
          load: true
          cache-from: type=gha,scope=pg-zhparser
          cache-to: type=gha,scope=pg-zhparser,mode=max

      # ★ 等"真的能接受连接"再往下：只等端口会拿到"容器在起但还没接受连接"，
      #   后端起不来时表现为 Flyway 连接被拒，看起来像迁移坏了 ——
      #   这条原来是 service 的 healthcheck 在管，换成 docker run 后必须自己写。
      # ★ 顺带把 `pg_extension` 打出来：它是"这张镜像到底对不对"的唯一显式事实。
      - name: 起真 PG
        run: |
          docker run -d --name aip-pg -p 5432:5432 \
            -e POSTGRES_USER=aiplatform \
            -e POSTGRES_PASSWORD=aiplatform \
            -e POSTGRES_DB=aiplatform \
            ai-knowledge-platform-pg:dev
          for i in $(seq 1 60); do
            if docker exec aip-pg pg_isready -U aiplatform -d aiplatform > /dev/null 2>&1; then
              echo "PG 就绪（第 ${i} 次探测）"
              docker exec aip-pg psql -U aiplatform -d aiplatform -tAc \
                "select extname from pg_extension order by extname"
              exit 0
            fi
            sleep 2
          done
          echo "★ PG 起不来 —— 后面六条闸门会全以连接被拒失败，那不是页面的问题。日志："
          docker logs aip-pg
          exit 1

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ★ 与 backend job 同样的三个包（理由见那里的注释）：官方 tesseract-ocr 只带 eng。
      #   真栈 job 尤其需要它 —— 它是唯一会去点「上传扫描件 → 已识别 N/M 页」这条链的地方。
      - name: 装 OCR 引擎与语言包
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
          tesseract --list-langs

      - name: 起 OpenAI 桩服务（向量化与模型目录都打它）
        working-directory: backend
        run: |
          python tools/openai_stub.py --port 11434 > /tmp/stub.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/v1/models > /dev/null; then
              echo "桩服务就绪"
              exit 0
            fi
            sleep 1
          done
          echo "★ 桩服务起不来 —— 向量化会全线失败。日志："
          cat /tmp/stub.log
          exit 1

      - name: 构建后端 jar
        working-directory: backend
        run: mvn -B -q -DskipTests package

      # ★ 用 `--app.security.captcha.enabled=false` 起：闸门要能在没有任何人工的情况下跑完
      #   （验证码是给人看的）。生产不许关，这里关的是**测试实例**。
      # ★ DB_URL 显式给：application.yml 的默认值是为本地 15432 写的占位值。
      - name: 起真后端
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/aiplatform
          DB_USER: aiplatform
          DB_PASSWORD: aiplatform
        run: |
          java -jar target/ai-knowledge-platform-0.0.1-SNAPSHOT.jar \
            --app.security.captcha.enabled=false > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "Started AiPlatformApplication" /tmp/backend.log; then
              echo "后端就绪（第 ${i} 次探测）"
              # ★ 顺带把 OCR 那一行打出来：它是"这台机器能不能 OCR"的唯一显式事实
              grep -E "OCR 引擎|OcrEngine" /tmp/backend.log || echo "（日志里没有 OCR 那一行 —— 留意是不是旧产物）"
              exit 0
            fi
            sleep 2
          done
          echo "★ 后端起不来 —— 后面五条闸门会全以连接被拒失败，那不是页面有问题。日志："
          cat /tmp/backend.log
          exit 1

      # ★ 真栈前端：覆盖 .env.development 里的 VITE_USE_MOCK=true 与错端口 18088。
      #   这两个默认值是"后端未就绪时走 mock"的遗留，不覆盖就会拿 mock 当"真栈证据"。
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 起真栈 dev server
        working-directory: frontend
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_TARGET: http://127.0.0.1:8080
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5280 > /dev/null; then
              echo "dev server ready after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "★ dev server 起不来。日志："
          cat /tmp/vite.log
          exit 1

      # ★ 再等一拍：vite 首次访问才编译，curl 通只代表端口在听（理由同 frontend job）
      - name: 预热首页
        run: |
          curl -s http://localhost:5280 > /dev/null
          curl -s http://localhost:5280/login > /dev/null
          sleep 5

      # ★ 与 frontend job 一样用 chromium + channel=chrome（runner 镜像自带 Chrome）
      - name: 装 playwright 浏览器
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # ★ check_segmentation_e2e.py 要**直接查库**：界面显示的是视图，库里的列才是入库链路的真相
      #   （search_text 有没有前缀、content_hash、embedding_status、进度列）。
      #   ★ CI 里的 PG 现在是 `docker run` 起的容器（名字 `aip-pg`），本机是 `aip-postgres`
      #     —— 名字不同 ⇒ 闸门**不走 `docker exec`**，用 psql 直连（连接由下面的 PG* 环境变量给，
      #     闸门自己会把它打进日志）。这样同一份闸门在本机与 CI 都成立。
      - name: 装 psql 客户端
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      # ★ 逐条记账，不遮蔽（理由见 frontend job 的浏览器闸门那一步）
      # ★ PG* 是给 check_segmentation_e2e.py 的：它读的库必须与后端写的库是同一个 ——
      #   不一致时它会立刻报「库里查不到刚上传的文档」并把连接打出来（以前会表现成"入库没生效"，指错方向）
      # ★ check_ocr_e2e.py（T249.4）走**界面**验扫描件那条链：上传 ⇒ 界面上「已识别 N/M 页」⇒ 入库成功，
      #   且文本型文档不出现进度行。它需要 tesseract（本 job 已装）+ 扫描件夹具。
      # ★ 第 11 周加 check_classification_e2e.py：同一份文档传成 PUBLIC/SECRET 两份，逐账号问一遍
      #   —— 它验的是「令牌里的 clearance 有没有真的进 SQL」，那条路只有从登录开始走才验得到。
      # ★ 第 12 周加 check_query_understanding_e2e.py：它自己注册并加载一个对话模型（夹具的一部分），
      #   然后断言埋点里的 M 子问题 × N 查询。★ 两条都**自己造夹具**，不依赖别的闸门留下的数据。
      - name: 真栈闸门（八条）
        working-directory: frontend
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: aiplatform
          PGPASSWORD: aiplatform
          PGDATABASE: aiplatform
        run: |
          failed=()
          for g in check_knowledge_parse check_knowledge_form check_segmentation_e2e \
                   check_document_actions check_flow_walkthrough check_ocr_e2e \
                   check_classification_e2e check_query_understanding_e2e; do
            echo "::group::${g}.py"
            if python "${g}.py"; then
              echo "✓ ${g}.py 通过"
            else
              echo "::error::${g}.py 失败"
              failed+=("${g}.py")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "★ 失败 ${#failed[@]}/8：${failed[*]}"
            exit 1
          fi
          echo "六条真栈闸门全部通过"

      # ★ 真栈红的时候，日志就是唯一的证据 —— 不留就等于让人去猜（本 job 第一次进 CI 时用过它）
      # ★ PG 现在是容器而不是 service ⇒ 它的日志不自动出现在 job 输出里，必须自己捞。
      - name: 失败时留 PG 日志
        if: failure()
        run: docker logs aip-pg > /tmp/pg.log 2>&1 || true

      - name: 失败时留真栈日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: realstack-logs
          path: |
            /tmp/backend.log
            /tmp/vite.log
            /tmp/stub.log
            /tmp/pg.log
            frontend/screenshots/
          if-no-files-found: ignore
