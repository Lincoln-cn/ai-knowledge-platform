name: 后端 · 回归 + 架构闸门

# ══════════════════════════════════════════════════════════════════════════════
#  从 ci.yml 拆出来的第二个（也是最大的一块）
#
#  ★ 拆之前的读数：后端 job 15 分 42 秒，其中 **`mvn verify` 一步 871 秒**。
#    那 871 秒里既有"单测 + 集成（Testcontainers 真 PG）+ 格式化"，也有**架构闸门**，
#    而架构闸门**只要编译、不要数据库** —— 它被压在集成测试后面，是最没道理的一段。
#
#  ★★ 本 workflow 的拆法（刻意保守，理由写死在这里）：
#    · **`mvn verify` 仍然整包跑，不按类清单拆档**。原因有两条，都可核对：
#      ① `pom.xml` 的 surefire 配了 `<failIfNoSpecifiedTests>true</failIfNoSpecifiedTests>`
#         —— 那是 Issue #50 落的（`-Dtest=A,B` 曾静默不跑却报成功）。于是"按类名列清单"
#         一旦写错一个字，job 会**立刻红**；而 110 个测试类靠手抄清单，写错的概率不低。
#      ② 拆档的风险是**漏类**（漏一个类 = 那一批回归在 CI 里静默失效，正是本项目头号病）。
#      ⇒ 整包跑是"不丢东西"的保证；本批只在**它之外**另加一条"架构闸门先跑"的快车道。
#    · 架构闸门单独成 job（`architecture`）：顶层那 9 个类里绝大多数只要编译，红的定位比混在整包里精确；
#      ★ 但**并非全部** —— `ContractDriftTest` / `MigrationIntegrationTest` 要 Testcontainers 的 PG 镜像
#      （本批真跑才发现的，逐字见该 job 的注释）。所以两个 job 都要先构建 PG 镜像。
#
#  ★ 判据：把 `ModuleBoundaryTest` 的边界弄坏 ⇒ 只有 `architecture` 红，`backend` 照常出读数；
#    把某条集成测试弄坏 ⇒ 只有 `backend` 红。任一侧红都不遮蔽另一侧。
#  ★★ 本批实测的收益（2026-10-17）：`architecture` 在 **2 分钟**内就报出了
#    "两个类拉不到 PG 镜像"，而同一轮的整包 `backend` 跑到 **13 分钟**才结束 ——
#    这正是拆分的意义（虽然那次红是我自己的假设错了，见该 job 的注释）。
# ══════════════════════════════════════════════════════════════════════════════

# ★★ 谁会真正跑到它（2026-11-01 补，起因是一次真实的误解）：
#    `on:` 只有 push-to-main / pull_request / workflow_dispatch。**特性分支直接 push 不会触发它** ——
#    本仓库这一路的开发都在 `feat/*` 上直接推、没有开 PR，于是"整包回归"只在**手动派发**时才跑
#    （`gh workflow run "后端 · 回归 + 架构闸门" --ref <branch>`）。
#    ⇒ 看 Actions 列表时不要以为"没有红色 = 整包绿"：它可能**根本没跑**。
# ★★ 另一条更隐蔽的静音：**PR 与 base 有合并冲突时，GitHub 不触发任何 pull_request workflow。**
#    实测：#222（feat/synthetic-corpus）自 2026-10-29 起就是 mergeable=CONFLICTING / DIRTY，
#    此后每次 push 的 pull_request 事件全被吞掉 —— `gh pr checks` 报 "no checks reported"，
#    Actions 里没有红色，看起来像"一切正常"。判据：疑心 CI 没跑时，先 `gh pr view <n> --json mergeable,mergeStateStatus`，
#    CONFLICTING/DIRTY ⇒ 先解冲突，否则再等也不会跑。
#    判据：想知道某个 head 有没有被整包覆盖，查 `gh run list --branch <b> --workflow ci-backend.yml`，
#    空结果 = 没跑过，不等于通过。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────── ① 架构 / 口径闸门（先跑，比整包早十几分钟出结果）───────────────────────
  #
  #  ★★ 本批实测纠正了一个**我自己的错误假设**：第一版这个 job 的名字写的是"不要 DB"，
  #    因为顶层的架构闸门（ModuleBoundary / PlatformPurity / TestNaming…）确实只要编译。
  #    但真跑当场红了，逐字：
  #        ContractDriftTest » ContainerFetch Can't get Docker image: ai-knowledge-platform-pg:dev
  #        MigrationIntegrationTest » ContainerFetch Can't get Docker image: ai-knowledge-platform-pg:dev
  #        Tests run: 17, Errors: 2
  #    —— ★ **`ContractDriftTest` 与 `MigrationIntegrationTest` 要 Testcontainers 的 PG 镜像**。
  #    ⇒ 本 job 必须与 `backend` job 一样先构建镜像。（本地能过我，是因为本机有那个镜像 —— 典型的环境差异。）
  #  ★ 它仍然值得单独成 job：17 条里 15 条只要编译，红的定位比混在整包里精确得多，
  #    而且**它 2 分钟就给出了答案**（整包 verify 要 15 分钟）。
  architecture:
    name: 架构 + 口径闸门
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ★ 自制 PG 镜像（pgvector + zhparser）—— `ContractDriftTest` / `MigrationIntegrationTest`
      #   通过 Testcontainers 拉 `ai-knowledge-platform-pg:dev`，缺它就直接 ContainerFetch 失败。
      #   ★ 与 `backend` job 用**同一个 gha 缓存 scope**（`pg-zhparser`）⇒ 第二次起基本秒级命中。
      - uses: docker/setup-buildx-action@v3

      - name: 构建 PG 镜像（自制：pgvector + zhparser）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pg/Dockerfile
          tags: ai-knowledge-platform-pg:dev
          load: true
          cache-from: type=gha,scope=pg-zhparser
          cache-to: type=gha,scope=pg-zhparser,mode=max

      # ★★ 两条通配符**各跑一次**，这是本仓的硬纪律：
      #   `*` **不跨包** ⇒ `cn.lincoln.aiplatform.*Test` 只匹配顶层包那 9 个类，
      #   而口径一族全在 `cn.lincoln.aiplatform.caliber`（2026-10-15 曾因此漏检一处真红）。
      #   ★ 每次都是**单模式**调用（满足"绝不用 `-Dtest=A,B`"那条纪律）。
      #   ★ 两条都靠 `<failIfNoSpecifiedTests>true</failIfNoSpecifiedTests>` 兜底：
      #     通配符要是哪天一个类都匹配不上，这里会**红**而不是静默通过。
      - name: 架构闸门（顶层包）
        working-directory: backend
        run: mvn -B test -Dtest='cn.lincoln.aiplatform.*Test'

      - name: 口径闸门（caliber 子包）
        working-directory: backend
        run: mvn -B test -Dtest='cn.lincoln.aiplatform.caliber.*Test'

      - name: 失败时留测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  # ─────────────────────── ② 全量回归（整包 mvn verify）───────────────────────
  backend:
    name: 后端 · 全量回归（整包 verify）
    runs-on: ubuntu-latest
    # ★ 上限的历史（三次读数，逐次写在下面，因为它直接决定"这个 job 给不给得出答案"）：
    #   ① 2026-10-17 拆分前实测 `mvn verify` 一步 871 秒（14.5 分钟），于是给了 40 分钟。
    #   ② 2026-10-31 起跑一次，**40 分钟到点时还在跑**（`knowledge.DocumentAuditFailureTest`，
    #      此前全绿）—— 加进来的真栈测试每条 25–47 秒（Testcontainers 起库），而 knowledge 一个包
    #      就有二十来个这样的类。871 秒那个读数属于"测试还没那么多"的年代。
    #   ③ ⇒ 改成 75 分钟。**理由不是"多给一点保险"，而是上限一旦被撞到，这个 job 给出的
    #      不是"红"而是 `cancelled`**（GitHub 对被超时中断的运行报 cancelled，与手动取消同形），
    #      而 `cancelled` 在判读上等于"没有读数"—— 一个不产出任何结论的闸门比慢十分钟更贵。
    # ★ 仍保留上限（不设 6 小时默认值）：卡住时要**明确超时**，而不是默默占着一台 runner。
    # ★ 真要让这条变快，正确方向是**拆 job 或减少真栈类**，不是继续抬这个数；抬到 75 分钟是
    #   为了让"整包"这个语义完整落地（拆档的风险见文件头：漏类 = 那一批回归静默失效）。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ★ 先起 OpenAI 桩服务，否则 OpenAiStubContractTest 会整体跳过 ——
      #   那 6 条里有两条是"框架有没有把 reasoning_effort 发出去""base-url 打得对不对"
      #   这类真证据，跳过它等于让这条回归在 CI 里静默失效。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 起 OpenAI 桩服务（供契约测试用）
        working-directory: backend
        run: |
          python tools/openai_stub.py --port 11999 > /tmp/stub.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11999/v1/models > /dev/null; then
              echo "桩服务就绪"
              exit 0
            fi
            sleep 1
          done
          echo "★ 桩服务起不来 —— 契约测试会因此被跳过。日志："
          cat /tmp/stub.log
          exit 1

      # ★ OCR 引擎与语言包必须装，否则 OcrParserTest（5 条）与 OcrEngineTest 里
      #   依赖真引擎的两条会**整体 assumeThat 跳过** —— CI 显示绿，而扫描件识别
      #   **没有任何回归在守**（issue #2）。
      # ★ 三个包都要列：官方 `tesseract-ocr` **只带 eng**，漏了 `tesseract-ocr-chi-sim`
      #   会让中文退化成方块/乱码 —— 而且不报错、不影响启动，是部署期最不可见的一类漏装。
      #   （`deploy/README.md` §三 的离线交付清单里，这三行与镜像是同源的。）
      - name: 装 OCR 引擎与语言包
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
          echo "已装："
          tesseract --version | head -1
          tesseract --list-langs

      # ★ 自制 PG 镜像（pgvector + zhparser）—— 集成测试（Testcontainers）靠它。
      #   设计册 `09 §10.2 #3` 的中文全文检索是 `to_tsvector('chinese_zh', …)`，
      #   而 `chinese_zh` 的 parser 只能是 zhparser；实测 pgvector 官方镜像里没有它、
      #   PGDG/Debian 也无现成包 ⇒ 只能自己编译（`deploy/pg/Dockerfile`）。
      #   ★ 带 GHA 层缓存：SCWS + zhparser 的编译只在缓存失效时发生（首次约 3–4 分钟，
      #     之后是命中缓存）。★ 这里放 buildx + build-push-action 而不是 `docker build`，
      #     就是为了拿到这份跨运行的缓存。
      - uses: docker/setup-buildx-action@v3

      - name: 构建 PG 镜像（自制：pgvector + zhparser）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pg/Dockerfile
          tags: ai-knowledge-platform-pg:dev
          load: true
          cache-from: type=gha,scope=pg-zhparser
          cache-to: type=gha,scope=pg-zhparser,mode=max

      # ★ 镜像自己的闸门（11 项）在"用镜像之前"跑：pgvector 真功能（建表/HNSW/余弦排序）、
      #   zhparser 精确分词（`'合同':1 '违约金':2`）、`simple` 对照、已知上限金丝雀、
      #   以及"交付镜像里没有 gcc/git"。镜像坏了必须在这里红，而不是伪装成"测试坏了"。
      - name: PG 镜像自检
        run: python deploy/verify_image_pg.py

      # ★★ 四类闸门一次跑完：单测 / 集成（Testcontainers 真 PG）/ 架构（Modulith verify + 金丝雀）/ 格式化。
      #   ★ 整包、不拆档（理由见文件头：`failIfNoSpecifiedTests` + 漏类风险）。
      #   ★ GitHub 的 ubuntu runner 自带 Docker，Testcontainers 可直接用。
      - name: mvn verify
        working-directory: backend
        run: mvn -B verify

      # ★ 零用例闸门：`Tests run: 0` 与「没有 `Tests run:` 行」一律按失败处理（Issue #53 / #50）。
      #   `Tests run: 0` 的形态：`@BeforeAll` 里的 `assumeThat` 不成立 ⇒ JUnit **中止整个容器** ⇒
      #   surefire 打出的正是 `Tests run: 0, Failures: 0, Errors: 0, Skipped: 0` + `BUILD SUCCESS`。
      #   没有 `Tests run:` 行的形态（Issue #50）：`-Dtest=A,B` 没匹配到任何类，控制台零读数却 BUILD SUCCESS。
      #   2026-10-11 实测：桩（11434）没起时 8 个依赖它的类全部以 `Tests run: 0` 形态"绿"着（见 Issue #53）。
      #   本 job 的桩在上面那一步已经起了（起不来会直接红），所以这些类**本该跑起来**：
      #   真出现 `Tests run: 0` 就是真问题，不是环境噪声。
      #   扫 surefire 报告目录（CI 每次全新 ⇒ 不存在"上一次留下的旧报告"）。
      - name: 零用例闸门
        run: python tools/check_zero_tests.py backend/target/surefire-reports

      # ★ 闸门自己的反证：空目录 / 无 `Tests run:` / `Tests run: 0` 必须红，真读数必须绿。
      #   没有这一步，"闸门能红"只是口头声明（Issue #50 判据 ①）。
      - name: 零用例闸门自测（必须能红）
        run: python tools/test_check_zero_tests.py

      - name: 失败时留测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
