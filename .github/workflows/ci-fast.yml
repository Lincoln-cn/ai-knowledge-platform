name: 快闸 · 编译 + 静态闸门

# ══════════════════════════════════════════════════════════════════════════════
#  为什么要单独一条 workflow（本批从 ci.yml 拆出来）
#
#  ★ 拆之前的读数（2026-10-17 真实 job 耗时）：
#      · 后端 job 15 分 42 秒，其中 **`mvn verify` 一步就 871 秒**
#      · 前端 job 6 分 40 秒，其中**静态闸门只占 1 秒**、typecheck+build 27 秒
#    ⇒ 最快的信号（静态闸门 1 秒、编译 ~30 秒）被压在 15 分钟的 job 后面 ——
#      "编译不过 / 静态闸门红"这类**本该 1 分钟知道**的事，要等 15 分钟。
#
#  ★ 本 workflow 的职责只有一个：**最便宜的失败要最先知道**。
#    它不跑任何需要数据库 / 浏览器 / 桩服务的东西 —— 那些各在自己的 workflow 里。
#
#  ★ 判据（本文件坏了会怎样）：把 `backend/` 编译弄坏，或把任何一道静态闸门弄红
#    ⇒ **本 workflow 单条红**，其余三条照旧出读数。不许出现"快闸红了但看不出为什么"。
# ══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────── ① 后端：编译 + 格式化 ───────────────────────────
  backend-compile:
    name: 后端 · 编译 + 格式化
    runs-on: ubuntu-latest
    # ★ 超时是判据的一部分：没有它，卡住会占满 GitHub 的默认 6 小时上限
    #   （本批拆分的触发原因之一就是"卡住 30 分钟没有任何产出"——那次是我误读，但风险是真的）。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ★ 版本线：Temurin 25（09 §4.1）。与 ci-backend.yml / ci-realstack.yml 同一个 JDK，
      #   避免"快闸过了、慢闸挂"这种最难查的分歧。
      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ★ `test-compile` 而不是 `compile`：测试代码编译不过**同样**要在快闸里红。
      #   它不需要数据库（只编译）、也不需要桩（不执行），所以是真正的"快"。
      - name: 编译主代码与测试代码
        working-directory: backend
        run: mvn -B -q test-compile -DskipTests

      # ★ 格式化闸门（google-java-format）。`spotless:check` 与 `apply` 的差别就是本步的意义：
      #   本地跑 apply、CI 跑 check —— 于是"忘了格式化"在 1 分钟内被发现。
      - name: 格式化闸门（spotless:check）
        working-directory: backend
        run: mvn -B -q spotless:check

      # ★ 发布台账：pom / package.json / package-lock / CHANGELOG 四处同号。
      #   本仓栽过一次三套编号并存（pom=0.0.1-SNAPSHOT、package=0.1.0、CHANGELOG=0.4.4），
      #   所以这条闸门必须自己也能红：--self-test 用四个临时样本证明它会报错。
      - name: 发布台账（版本三处 + CHANGELOG）
        run: |
          python3 tools/check_release_metadata.py --self-test
          python3 tools/check_release_metadata.py

      # ★ 桩的「行为注入」自检（#45）：桩原来只能造传输层故障（延迟 / 500），造不出"模型真的
      #   泄露了系统提示词" ⇒ 安全闸门的金丝雀 K1 恒绿。这条自检先证明**造得出坏**，
      #   再谈"闸门挡住了"；顺带钉住"注入只作用于生成调用、不改查询理解那一次的 JSON"。
      #   不起 HTTP：桩的"坏"是回答文本的形状，与传输无关。
      - name: 桩行为注入自检（#45）
        run: python3 backend/tools/openai_stub.py --self-check

  # ─────────────────────────── ② 前端：类型 + 静态闸门 ───────────────────────────
  frontend-static:
    name: 前端 · 类型检查 + 静态闸门
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ★ 必须在跑 python 脚本之前：runner 上只有 python3，
      #   而这些脚本全部以 `python xxx.py` 的方式被调用
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      # ★ 类型检查放在静态闸门之前：它是最便宜的"整体形状"信号（27 秒）。
      - name: 类型检查（vue-tsc）
        working-directory: frontend
        run: npm run typecheck

      # ★ 单元断言（不起服务、不绑端口 —— 沙箱与本机都能跑）。
      #   ★★ 为什么在 `npm test` 里**显式列文件**而不是交给 `node --test` 的目录发现：
      #   `.test.ts` 的自动发现与 Node 版本挂钩，猜错就是「0 条测试、exit 0」——
      #   那是**一个永远不红的闸门**，比没有闸门更坏（R58：修闸门与改成绿的读数一样）。
      #   代价是新增测试要同时加进那条命令；判据是「红得出来」，不是「省事」。
      #   `--experimental-strip-types`：22.18+ 与 24 上是 no-op，22.6–22.17 上才是开关。
      - name: 单元断言（node --test）
        working-directory: frontend
        run: npm test

      # ★★ 逐条记账、不遮蔽（issue #19）：用 shell 的 `set -e` 串起来，等于
      #   "第一个坏了就再也看不到后面几条"。判据没有弱化 —— 任一条红，本步最后照样 exit 1；
      #   变的是"红的时候能不能看见全貌"。
      #
      # ★ 这些都是**不需要浏览器**的纯静态闸门（原 ci.yml 的"第一组"）。
      #   ★ 新增 `check_role_subject_key.py`（本会话为 #57 落的）：
      #     共享主体 ROLE 的取值口径 —— 它防的是"两端各自完成、合起来静默不命中"。
      #   ★ 新增 `check_permission_catalog.py`（A7 写入口扩铺时落的）：权限点清单三端对账 ——
      #     后端 `identity/domain/Permissions.java` 的常量与角色初始映射 / 前端 `PERM` /
      #     mock 的角色勾选目录。它防的是本会话实测到的形态：**权限点存在、但没有任何角色持有**
      #     ⇒ 写入口对包括管理员在内的所有人隐形，而页面与接口各自看起来都"正常"
      #     （`knowledge:qa:edit` 与 `conversation:settings` 就是这样隐形的）。
      # ★ check_states.py 管「空态/错误态」（ROADMAP §五 F4）：错误态是硬闸
      #   （有接口的页面必须为「拉不到数据」准备过呈现 —— 漏了就是静默失败），
      #   表格空态只记账不判红（`el-table` 自带「暂无数据」，缺的是"下一步"，
      #   账在 #256）。两种结局都必须能红：漏账、以及修好后忘了删账。
      # ★ check_mock_endpoints.py 管「mock 替谁作保」：每条 mock 路由都必须在前端契约里出现过。
      #   它防的是 `#211` 的形状 —— mock **真的实现**了一个契约里没有、后端也没有的端点，
      #   于是 mock 模式下这条路能跑、开发时完全看不出"真后端没有它"。
      - name: 静态闸门（11 道）
        working-directory: frontend
        run: |
          failed=()
          for g in verify_refs check_template_tags check_design check_error_codes \
                   check_workflow_node_types check_deeplink_segments check_role_subject_key \
                   check_permission_catalog check_states check_pending_endpoints                    check_mock_endpoints; do
            echo "::group::${g}.py"
            if python "${g}.py"; then
              echo "✓ ${g}.py 通过"
            else
              echo "::error::${g}.py 失败"
              failed+=("${g}.py")
            fi
            echo "::endgroup::"
          done
          # ★ 第三格门禁（`#79`）：契约与后端都有、但**页面零消费**的端点会红。
          #   它防的是"后端那半能编译能过测试、闸门全绿，但点不动"——最难发现的那类遗漏。
          #   基线在 `tools/consumer-baseline.txt`，向后端目录之外跑，所以单独一步。
          if [ ${#failed[@]} -gt 0 ]; then
            echo "★ 失败 ${#failed[@]}/11：${failed[*]}"
            exit 1
          fi
          echo "10 道静态闸门全部通过"

      # ★ 第 11 道：**读数的纪律**（#231）。
      #   防的形状是「400 被读成命中 0 条」—— 后端 `topN` 上限 20、超限返 400，
      #   而 400 的响应体里没有 `data`，于是 `(payload.get("data") or {}).get("items") or []`
      #   会把一次被拒的请求读成「一条都没命中」：脚本照常跑完、照常打印「命中 0/215」，
      #   B1/B3 读数**凭空归零**，而结果看起来与「检索完全不可用」一模一样。
      #   `--self-check` 不需要任何服务：它把 `call()` 换成桩，验三条 ——
      #   非 200 终止 / 命中项缺 `docName` 终止（取错键同样是「没命中」）/ 空命中是合法读数。
      #   ★ 判据：把 `retrieve_or_die` 改回 `or []` 的形状 ⇒ 这一步红。
      - name: 读数纪律自检（#231）
        run: python scripts/parse_corpus.py --self-check

      # ★ 恢复演练记录的可核对性（#75 判据 ③）：模板里留「待补」是刻意的 —— 没填完一定红。
      #   这条自检跑的是检查器自己（离线、不需要数据库），真正的演练记录在 deploy/restore-drill-record.md。
      - name: 前后端配对第三格（#79）
        run: |
          python tools/check_contract_consumers.py --self-test
          python tools/check_contract_consumers.py --check

      - name: 恢复演练记录自检（#75）
        run: python scripts/restore_drill.py --self-check

      # ★ `app.*` 配置键：代码里引用了、yml 里没声明 => Spring 用默认值静默起起来（silent-failure）。
      #   读的是仓库里那一份（`git show HEAD:`），CI 下与工作树一致。
      - name: 配置键声明自检（#75/#227）
        working-directory: backend
        run: |
          python tools/check_config_keys.py --self-check
          python tools/check_config_keys.py

      # ★ 闸门自己的守卫也要能被断言（#223）：这三条守的是"别量错东西"，
      #   而一条守卫错了的表现是静默 —— 永远为真等于没有，过严则把正确情形判成错。
      #   离线、不需要浏览器、不连栈（playwright 在脚本里是延迟导入的）。
      - name: 机器状态守卫自检（#223）
        working-directory: frontend
        run: python check_failure_visible_e2e.py --self-check
