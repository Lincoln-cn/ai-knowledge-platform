name: 前端 · 浏览器闸门

# ══════════════════════════════════════════════════════════════════════════════
#  从 ci.yml 拆出来的第三块（原前端的"第二组"）
#
#  ★ 拆之前的读数：前端 job 6 分 40 秒，其中
#      · 静态闸门 **1 秒**、typecheck+build 27 秒   ← 这两个已经进了 `ci-fast.yml`
#      · **浏览器闸门 193 秒**                      ← 本文件
#      · 功能点/冒烟 118 秒                          ← 进 `ci-frontend-build.yml`
#    ⇒ 拆完：静态/类型错 **1 分钟内**红；浏览器闸门红 **2 分钟内**出结果；
#      而"构建 + dist 冒烟"不再拖累前两者。
#
#  ★ 本 workflow 只做一件事：**起 mock 模式的 dev server，跑 11 个确定性浏览器闸门**。
#    ★ 刻意**不**放进来的两个（原 ci.yml 就有明确理由，照抄在这里）：
#      · `verify_permissions.py` —— 仍有约 1/8 偶发（登录后不跳转），
#        没弄清之前不接：随机红比不红更坏（会有人去改本来没错的东西）。跟踪 issue #14。
#      · `check_flow_walkthrough.py` / `check_*.e2e` 那些 —— 它们要**真栈**，
#        归 `ci-realstack.yml`。
# ══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-gates:
    name: 前端 · 11 个确定性闸门
    runs-on: ubuntu-latest
    # ★ 实测 ~5 分钟（含装 playwright 34 秒、11 门 193 秒）。给 20 分钟上限：
    #   超时会**明确红**而不是占满 6 小时。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ★ 必须在跑 python 脚本之前：runner 上只有 python3，
      #   而这些脚本全部以 `python xxx.py` 的方式被调用
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      # ★ 实测结论（2026-09，本机两遍）：这 19 个 .py 里有 16 个 import playwright，
      #   其中 14 个（3 个纯静态 + 11 个浏览器）两遍结果**完全一致**，可以当确定性闸门用；
      #   另外 3 个当前 flaky，**故意不放在这里**。
      - name: 装 playwright 浏览器（Python 侧）
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 起 dev server 并等就绪
        working-directory: frontend
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5280 > /dev/null; then
              echo "dev server ready after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "★ dev server 起不来 —— 后面所有浏览器闸门都会以 ERR_CONNECTION_REFUSED 失败，"
          echo "  那不是页面有问题，是基础设施没就绪。日志："
          cat /tmp/vite.log
          exit 1

      # ★ 等就绪之后还要再等一拍：vite 是**首次访问才编译**，
      #   curl 通只代表端口在听。实测在这一拍上踩过：verify_permissions 冷启动时报
      #   "49/50"，热了之后是 "49/49" —— 数字不同不是代码变了，是页面还没编译完。
      - name: 预热首页（触发 vite 首次编译）
        run: |
          curl -s http://localhost:5280 > /dev/null
          curl -s http://localhost:5280/login > /dev/null
          sleep 5

      # ★★ 逐条跑完并记账，**不让第一个失败遮蔽其余**（issue #19）。
      #
      #   这些闸门是互相独立的信号。用 shell 的 `set -e`（GHA 默认）串起来，等于
      #   "第一个坏了就再也看不到后面 10 条" —— 实测代价：2026-09-28 起 `check_nodeconfig.py`
      #   超时，于是 check_node_menu / check_canvas / … 共 9 条**连续一周多从没在 CI 里执行过**，
      #   工作流里却写着"11 个确定性闸门"。那也是一种"看起来在做、实际没生效"。
      #
      #   ★ 判据没有弱化：任一条红，这一步最后照样 exit 1。变的是"红的时候能不能看见全貌"。
      - name: 浏览器闸门（11 个确定性闸门）
        working-directory: frontend
        run: |
          failed=()
          for g in check_theme check_nodeconfig check_node_menu check_canvas check_collapse \
                   check_history check_palette check_pickers check_assistants check_singleton \
                   check_publish; do
            echo "::group::${g}.py"
            if python "${g}.py"; then
              echo "✓ ${g}.py 通过"
            else
              echo "::error::${g}.py 失败"
              failed+=("${g}.py")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "★ 失败 ${#failed[@]}/11：${failed[*]}"
            exit 1
          fi
          echo "11 个浏览器闸门全部通过"

      # ★ 失败时留现场：这些闸门出错时会往 `frontend/screenshots/` 写截图，
      #   没有它就得让人去猜"当时页面长什么样"。
      - name: 失败时留截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-gate-screenshots
          path: frontend/screenshots/
          if-no-files-found: ignore
