spring:
  application:
    name: ai-knowledge-platform

  threads:
    virtual:
      enabled: true # ADR-01：IO 密集用虚拟线程，不用响应式（09 §4.5）

  datasource:
    # ★ 15432 是 docker-compose.yml 里的宿主端口（不是 PG 标准的 5432）——
    #   原因见那份文件：本机 Windows 的保留端口段含 5432，Docker 绑不上。
    #   部署到 Linux 时把它设回 5432 即可（这本来就是 DB_URL 环境变量的用处）。
    # ⚠️ 下面三个默认值是**本地开发的占位值**（与 docker-compose.yml 对齐），
    #    不是可以带进生产的配置 —— 任何非本地环境都必须用环境变量覆盖它们。
    url: ${DB_URL:jdbc:postgresql://localhost:15432/aiplatform}
    username: ${DB_USER:aiplatform}
    password: ${DB_PASSWORD:aiplatform}

  jpa:
    hibernate:
      # ★ schema 由 Flyway 管，Hibernate 只校验、绝不改结构（09 §9.4 的同一条立场）
      ddl-auto: validate
    # ★ 必须关：默认 true 会在"视图渲染期"仍持有连接。我们的响应是流式的（SSE），
    #   开着它等于把连接池耗在已经没人读的响应上（03 机制七）
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # 各模块的迁移放在 db/migration/<模块>/ 下（02 §5.1：模块自治，便于未来拆库）
    locations: classpath:db/migration

  ai:
    openai:
      # ★ 开发期直连 Ollama 自带的 OpenAI 兼容端点（09 §3.13.5）。
      #   试用期换 JAiRouter 时只改这一行 —— 这也是"不用网关专有字段"这条纪律的用处。
      base-url: ${AI_BASE_URL:http://localhost:11434/v1}
      # Ollama 不校验 key，但 Spring AI 的 OpenAI 自动配置要求它非空
      api-key: ${AI_API_KEY:ollama-local}

app:
  security:
    jwt:
      # ★ 必须是 URL 形式，不能是 "ai-knowledge-platform" 这样的裸串 ——
      #   Spring 的 Jwt.getIssuer() 返回 URL，裸串会在读取 iss 时抛转换异常
      issuer: http://ai-knowledge-platform.local
      # 契约侧的形状见 08 §4.0：access 30 分钟 / refresh 7 天
      access-ttl: 30m
      refresh-ttl: 7d
      # ⚠️ 本地开发默认密钥（Base64 的 37 字节随机串，只用于本机）。
      #    任何非本地环境都必须用环境变量覆盖 —— 这个值在仓库里，等于公开：
      #    拿到它就能伪造任意用户的令牌。
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2Q=}

    captcha:
      # ★ 等保要求登录带验证码，所以默认开启。留开关是为了压测/自动化能关掉 ——
      #   不是为了生产能关（关掉就等于放弃了那一条测评项）
      enabled: ${CAPTCHA_ENABLED:true}
      # 验证码有效期。它只需要"够人输入一次"，越短越好
      ttl: 2m

    login-failure:
      # ★ 等保：对登录失败做次数限制并在超限后冻结账号。本项目取 3 次 / 30 分钟
      max-attempts: ${LOGIN_MAX_ATTEMPTS:3}
      lock-duration: ${LOGIN_LOCK_DURATION:30m}

  model:
    # ⚠️ 本地开发默认密钥（Base64 的 32 字节随机串，只用于本机）。
    #    任何非本地环境都必须用环境变量覆盖 —— 这个值在仓库里，等于公开：
    #    拿到它就能解开库里所有模型的 API key。
    #    生成自己的密钥：[Convert]::ToBase64String((1..32|%{Get-Random -Max 256}))
    api-key-secret: ${MODEL_API_KEY_SECRET:ZGV2LW9ubHktYXBpLWtleS1zZWNyZXQtMzJieXRlcyE=}

  egress:
    # ★★ 出站闸门（#72）：EXTERNAL_API 供应商的模型允许处理到的最高密级。
    #   「密级」管"谁能读"，这一条管"读到的内容允许送到哪里" —— 两者正交（issue 原文的根因）。
    #   ★ 默认 INTERNAL 是**刻意保守**的：SECRET / CONFIDENTIAL 一律不得发给外部 API。
    #     反过来（默认最高档）会让"没配"与"允许发机密"读数一样 —— 那正是 silent-failure。
    #   ★ LOCAL_INFERENCE 不受此限（它不出网，判据表见 ModelEgressAdapter）。
    #   ★ 取值：PUBLIC / INTERNAL / SECRET / CONFIDENTIAL（13 §6.3 的 ceiling 口径）。
    external-api-ceiling: ${EGRESS_EXTERNAL_API_CEILING:INTERNAL}

  segmentation:
    # 分块目标长度默认值。★ 与前端向导 CreateWizard.vue 的 segForm.segmentLength 默认值一致 ——
    #   否则用户在预览里看到的与入库得到的不同。
    segment-length: ${SEGMENT_LENGTH:500}
    # 重叠字符数默认值。★ 与前端 segForm.overlap 默认值一致。
    overlap: ${SEGMENT_OVERLAP:60}
    # 向量模型字符上限的回落值。① KB 绑定的向量模型有 contextWindow 则用它（近似）；
    #   ② 否则用这里的默认 1200 —— ★ 与前端 mock 的 MODEL_LIMIT = 1200 一致，避免 mock/真栈漂移。
    max-chars: ${SEGMENT_MAX_CHARS:1200}

  ocr:
    # ══════════════════════════════════════════════════════════════════════════
    #  扫描件 OCR（第 9 周 0.3.1 · 12 §11）
    #
    #  ★★ 这一组配置存在的理由：OCR 引擎是【系统级资产】，不像 jar 那样跟着构建走。
    #     装没装、语言包拷没拷，决定了"扫描件能不能入库" —— 而漏装不会报错，
    #     只表现为"扫描件解析出空"，落进那句「可能是扫描件」的通用文案。
    #     ⇒ 所以路径显式配、结论显式报（启动日志 WARN + /actuator/health 的 components.ocr）。
    #
    #  ★ 离线部署（内网/单客户私有化，ROADMAP §九）：下面的 ENV 就是交付时要核对的东西。
    #     镜像里必须有 ① tesseract 可执行文件 ② 每个语言对应的 <lang>.traineddata。
    #     详细清单（含文件名与校验）见 deploy/README.md 的「离线交付清单 · OCR」段。
    # ══════════════════════════════════════════════════════════════════════════

    # 总开关。★ 默认开：装好了就直接能用；没装也不会出错，只是 health 里显示 DEGRADED + 可读原因。
    enabled: ${OCR_ENABLED:true}

    # tesseract 可执行文件所在目录或完整路径。
    # ★ 留空 = 走 PATH（开发机通常如此）。★ 生产/离线交付请显式给 ——
    #   留空意味着"环境里恰好有"，而这正是本项目最不想要的偶然后果。
    tesseract-path: ${OCR_TESSERACT_PATH:}

    # 语言包目录。★ 12 §11.2 的坑 ①：「tessdata 路径必须显式给」。
    #   留空 = 依次尝试 TESSDATA_PREFIX 环境变量；两处都没有时唯一能确认的结论是"引擎在、语言包无法核对"。
    #   例：Linux 镜像 /usr/share/tesseract-ocr/5/tessdata；Windows + scoop 见 %TESSDATA_PREFIX%。
    tessdata-path: ${OCR_TESSDATA_PATH:}

    # Tesseract 语言参数。★ 每个语言都要有 <lang>.traineddata；缺中文包时中文会退化成方块/乱码，且不报错。
    languages: ${OCR_LANGUAGES:chi_sim+eng}

    # 光栅化 DPI。12 §11.3/§11.4 定的下限是 300 —— 调低会明显掉识别率，别为了省时间动它。
    dpi: ${OCR_DPI:300}

    # 单页 OCR 超时（秒）。★ 必须有上限：一页 A4 CPU 约 1–5 秒（12 §11.1），
    #   但没有上限时一张异常大的图会把后台任务挂死，而界面上只看到"一直在跑"。
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:120}

    # 图像预处理（deskew 等）。12 §11.4 要求 deskew 必开（扫描件常有倾斜）。
    preprocess: ${OCR_PREPROCESS:true}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    cn.lincoln.aiplatform: DEBUG
  # 结构化 JSON 日志（Boot 3.4+ 内置，不引第三方 encoder：09 §10.1）。
  # 开发期保持关闭 —— 采集环境才需要它，本地读文本更省事。
  # structured:
  #   format:
  #     console: ecs
