spring:
  # ★★ SSE 只保留**一个**权威上限：`app.chat.idle-timeout-ms`
  #
  # 原来这里有**两个**上限打架（`#181` 的根因）：
  #   ① Spring MVC 的 async 默认 **30s**（本文件从未配置它）—— 它先砍；
  #   ② 项目自己的 `ChatStreamProperties.idleTimeoutMs = 300s` + 20s 心跳 —— 永远轮不到。
  # 实测（CPU + qwen2.5:1.5b）：问答在 **30 秒整**断流，前端拿到 503，
  # 后端日志 `AsyncRequestTimeoutException at TimeoutCallableProcessingInterceptor`。
  #
  # ⇒ 这里设 **-1（不设限）**，让「多久没字节写出才判吊死」只由 idle 决定。
  #   ★ 为什么不是"把 async 调得比 idle 大"：那仍然要求**两个数永远保持顺序**，
  #     而 config 是可以分别改的 —— 这种"靠人记住两个数的关系"的约束，迟早会被改坏。
  #   ★ 代价：async 层不再兜底。真正的兜底在 `ChatService` 的 idle 判定
  #     （它按时钟判、且会把终态落库，比容器层的中断干净得多）。
  mvc:
    async:
      request-timeout: ${SSE_ASYNC_TIMEOUT:-1}
  # 上传体积上限（`FR-03-05-3`：单文件 100MB）。
  # ★★ 不配的话 Boot 默认 **1MB** —— 实测 16 个语料里 ≥1368KB 的全部返回 500，
  #   而设计书写的是 100MB（差了 100 倍，且 500 会让人误以为"服务端坏了"从而反复重试）。
  # ★ 超限时的响应由 `GlobalExceptionHandler#onUploadTooLarge` 改写成 413 + 可读原因。
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:120MB}

  application:
    name: ai-knowledge-platform

  threads:
    virtual:
      enabled: true # ADR-01：IO 密集用虚拟线程，不用响应式（09 §4.5）

  datasource:
    # ★ 15432 是 docker-compose.yml 里的宿主端口（不是 PG 标准的 5432）——
    #   原因见那份文件：本机 Windows 的保留端口段含 5432，Docker 绑不上。
    #   部署到 Linux 时把它设回 5432 即可（这本来就是 DB_URL 环境变量的用处）。
    # ⚠️ 下面三个默认值是**本地开发的占位值**（与 docker-compose.yml 对齐），
    #    不是可以带进生产的配置 —— 任何非本地环境都必须用环境变量覆盖它们。
    url: ${DB_URL:jdbc:postgresql://localhost:15432/aiplatform}
    username: ${DB_USER:aiplatform}
    password: ${DB_PASSWORD:aiplatform}

  jpa:
    hibernate:
      # ★ schema 由 Flyway 管，Hibernate 只校验、绝不改结构（09 §9.4 的同一条立场）
      ddl-auto: validate
    # ★ 必须关：默认 true 会在"视图渲染期"仍持有连接。我们的响应是流式的（SSE），
    #   开着它等于把连接池耗在已经没人读的响应上（03 机制七）
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # 各模块的迁移放在 db/migration/<模块>/ 下（02 §5.1：模块自治，便于未来拆库）
    locations: classpath:db/migration

  ai:
    openai:
      # ★ 开发期直连 Ollama 自带的 OpenAI 兼容端点（09 §3.13.5）。
      #   试用期换 JAiRouter 时只改这一行 —— 这也是"不用网关专有字段"这条纪律的用处。
      base-url: ${AI_BASE_URL:http://localhost:11434/v1}
      # Ollama 不校验 key，但 Spring AI 的 OpenAI 自动配置要求它非空
      api-key: ${AI_API_KEY:ollama-local}

app:
  # ─── 业务示例数据（`db/seed`，默认关闭）───
  #
  # ★ 只有打开时才把 `classpath:db/seed` 追加进 Flyway 的 locations（见
  #   `cn.lincoln.aiplatform.platform.seed.SampleDataFlywayConfiguration`）。
  # ★ 为什么默认关：集成测试与它共用同一套迁移，默认灌业务数据会让一批「按条数断言」
  #   的用例红 —— 详细理由写在 `db/seed/V900__sample_business_data.sql` 头部。
  # ★ 试用/演示环境打开：`SEED_SAMPLE_DATA=true` 后再启动后端（迁移只跑一次）。
  seed:
    sample-data: ${SEED_SAMPLE_DATA:false}

  # ─── 进程内 ONNX 向量化（`#172`）───
  #
  # ★★ 默认模型 = `multilingual-e5-small`（**中英双语**，384 维，int8 112.8MB）。
  #    选它的依据是实测，不是偏好：同一套 16 份语料 + 12 条问答对，只换模型
  #      bge-small-zh-v1.5（22.9MB / 512 维）     → 命中 6/12（50%），英文文档 1/6
  #      multilingual-e5-small（112.8MB / 384 维） → 命中 10/12（83%），英文文档 5/6
  #    读数与复现步骤见 `models/README.md` 第八节。
  # ★ 代价：体积是中文单语模型的 ~5 倍（多语模型的词表大，embedding 矩阵在量化件里仍是 fp32）。
  # ★ 模型文件**不进仓库**（`models/*` 被 .gitignore 忽略），落盘步骤见 `models/README.md`。
  embedding:
    local:
      enabled: ${LOCAL_ONNX_ENABLED:true}
      model-path: ${LOCAL_ONNX_MODEL_PATH:models/multilingual-e5-small/model_quantized.onnx}
      tokenizer-path: ${LOCAL_ONNX_TOKENIZER_PATH:models/multilingual-e5-small/tokenizer.json}
      # ★★ 这个名字是**路由判据**（`RoutingEmbeddingAdapter` 按 baseModel 名分派）：
      #    知识库里登记的 `baseModel` 必须与它一致，否则那条模型会去连上游 11434。
      model-name: ${LOCAL_ONNX_MODEL_NAME:multilingual-e5-small}

  # ─── 检索链路的时间预算与低配开关（`10 §6.2` 第 6 项）───
  #
  # ★★ 这两项原先是写死的 5s 常量：GPU + 7B 上够用，而 **CPU + 1.5B** 上一次查询理解
  #    实测 4–5s（重试一次共 7.9s）⇒ 5s 总预算在**第 0 路**就耗尽，日志是
  #    `检索预算 5000ms 已耗尽（已跑 0 路）`，随后整条链路降级成单路。
  #    默认值**保持 5000**（不改变已有部署行为）；低配用 `--spring.profiles.active=lowend`。
  retrieval:
    # 单次"查询理解"（改写/拆子问题）调用的超时
    query-understanding-budget-ms: ${RETRIEVAL_QU_BUDGET_MS:5000}
    # 检索阶段总预算：每一路开始前检查余量，耗尽就用已拿到的结果继续
    total-budget-ms: ${RETRIEVAL_TOTAL_BUDGET_MS:5000}
    # 多跳的"该收手了"水位（0.6 = 用掉 60% 就不再开新一轮，10 §6.3）
    hop-budget-ratio: ${RETRIEVAL_HOP_BUDGET_RATIO:0.6}
    # ★ 低配可关：关掉则**主动单路**（degradeLevel 保持 0，不是"降级"）
    query-understanding-enabled: ${RETRIEVAL_QU_ENABLED:true}
    # ★ 低配可关：解析失败时不再调第二次模型（CPU 上省 4–5s）
    query-understanding-retry-on-parse-failure: ${RETRIEVAL_QU_RETRY:true}
  security:
    jwt:
      # ★ 必须是 URL 形式，不能是 "ai-knowledge-platform" 这样的裸串 ——
      #   Spring 的 Jwt.getIssuer() 返回 URL，裸串会在读取 iss 时抛转换异常
      issuer: http://ai-knowledge-platform.local
      # 契约侧的形状见 08 §4.0：access 30 分钟 / refresh 7 天
      access-ttl: 30m
      refresh-ttl: 7d
      # ⚠️ 本地开发默认密钥（Base64 的 37 字节随机串，只用于本机）。
      #    任何非本地环境都必须用环境变量覆盖 —— 这个值在仓库里，等于公开：
      #    拿到它就能伪造任意用户的令牌。
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2Q=}

    captcha:
      # ★ 等保要求登录带验证码，所以默认开启。留开关是为了压测/自动化能关掉 ——
      #   不是为了生产能关（关掉就等于放弃了那一条测评项）
      enabled: ${CAPTCHA_ENABLED:true}
      # 验证码有效期。它只需要"够人输入一次"，越短越好
      ttl: 2m

    login-failure:
      # ★ 等保：对登录失败做次数限制并在超限后冻结账号。本项目取 3 次 / 30 分钟
      max-attempts: ${LOGIN_MAX_ATTEMPTS:3}
      lock-duration: ${LOGIN_LOCK_DURATION:30m}

    public-rate-limit:
      # ★ 公开面（免登录）限流（#214）：链接解析 / 读历史 / 停止生成 / 带 X-Access-Credential 的问答流。
      #   它缺的从来不是读数，是实现 —— 2026-10-27 全仓 grep rate.?limit|bucket4j|throttl 是 0 命中。
      #   ★ enabled 默认 true：安全开关的默认值必须是"开着"，否则漏配的环境会静默退回无限流。
      #   ★ 60 次 / 60 秒 = 一个访客正常读一条链接（解析 → 历史 → 问几轮）到不了的量。
      #   ★ 真栈读数见 PublicRateLimitHttpTest（它会把 capacity 压到 3 来证"真的会 429"）。
      enabled: ${PUBLIC_RATE_LIMIT_ENABLED:true}
      capacity: ${PUBLIC_RATE_LIMIT_CAPACITY:60}
      window-seconds: ${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:60}

  model:
    # ⚠️ 本地开发默认密钥（Base64 的 32 字节随机串，只用于本机）。
    #    任何非本地环境都必须用环境变量覆盖 —— 这个值在仓库里，等于公开：
    #    拿到它就能解开库里所有模型的 API key。
    #    生成自己的密钥：[Convert]::ToBase64String((1..32|%{Get-Random -Max 256}))
    api-key-secret: ${MODEL_API_KEY_SECRET:ZGV2LW9ubHktYXBpLWtleS1zZWNyZXQtMzJieXRlcyE=}

  egress:
    # ★★ 出站闸门（#72）：EXTERNAL_API 供应商的模型允许处理到的最高密级。
    #   「密级」管"谁能读"，这一条管"读到的内容允许送到哪里" —— 两者正交（issue 原文的根因）。
    #   ★ 默认 INTERNAL 是**刻意保守**的：SECRET / CONFIDENTIAL 一律不得发给外部 API。
    #     反过来（默认最高档）会让"没配"与"允许发机密"读数一样 —— 那正是 silent-failure。
    #   ★ LOCAL_INFERENCE 不受此限（它不出网，判据表见 ModelEgressAdapter）。
    #   ★ 取值：PUBLIC / INTERNAL / SECRET / CONFIDENTIAL（13 §6.3 的 ceiling 口径）。
    external-api-ceiling: ${EGRESS_EXTERNAL_API_CEILING:INTERNAL}

  segmentation:
    # 分块目标长度默认值。★ 与前端向导 CreateWizard.vue 的 segForm.segmentLength 默认值一致 ——
    #   否则用户在预览里看到的与入库得到的不同。
    segment-length: ${SEGMENT_LENGTH:500}
    # 重叠字符数默认值。★ 与前端 segForm.overlap 默认值一致。
    overlap: ${SEGMENT_OVERLAP:60}
    # 向量模型字符上限的回落值。① KB 绑定的向量模型有 contextWindow 则用它（近似）；
    #   ② 否则用这里的默认 1200 —— ★ 与前端 mock 的 MODEL_LIMIT = 1200 一致，避免 mock/真栈漂移。
    max-chars: ${SEGMENT_MAX_CHARS:1200}

  ocr:
    # ══════════════════════════════════════════════════════════════════════════
    #  扫描件 OCR（第 9 周 0.3.1 · 12 §11）
    #
    #  ★★ 这一组配置存在的理由：OCR 引擎是【系统级资产】，不像 jar 那样跟着构建走。
    #     装没装、语言包拷没拷，决定了"扫描件能不能入库" —— 而漏装不会报错，
    #     只表现为"扫描件解析出空"，落进那句「可能是扫描件」的通用文案。
    #     ⇒ 所以路径显式配、结论显式报（启动日志 WARN + /actuator/health 的 components.ocr）。
    #
    #  ★ 离线部署（内网/单客户私有化，ROADMAP §九）：下面的 ENV 就是交付时要核对的东西。
    #     镜像里必须有 ① tesseract 可执行文件 ② 每个语言对应的 <lang>.traineddata。
    #     详细清单（含文件名与校验）见 deploy/README.md 的「离线交付清单 · OCR」段。
    # ══════════════════════════════════════════════════════════════════════════

    # 总开关。★ 默认开：装好了就直接能用；没装也不会出错，只是 health 里显示 DEGRADED + 可读原因。
    enabled: ${OCR_ENABLED:true}

    # tesseract 可执行文件所在目录或完整路径。
    # ★ 留空 = 走 PATH（开发机通常如此）。★ 生产/离线交付请显式给 ——
    #   留空意味着"环境里恰好有"，而这正是本项目最不想要的偶然后果。
    tesseract-path: ${OCR_TESSERACT_PATH:}

    # 语言包目录。★ 12 §11.2 的坑 ①：「tessdata 路径必须显式给」。
    #   留空 = 依次尝试 TESSDATA_PREFIX 环境变量；两处都没有时唯一能确认的结论是"引擎在、语言包无法核对"。
    #   例：Linux 镜像 /usr/share/tesseract-ocr/5/tessdata；Windows + scoop 见 %TESSDATA_PREFIX%。
    tessdata-path: ${OCR_TESSDATA_PATH:}

    # Tesseract 语言参数。★ 每个语言都要有 <lang>.traineddata；缺中文包时中文会退化成方块/乱码，且不报错。
    languages: ${OCR_LANGUAGES:chi_sim+eng}

    # 光栅化 DPI。12 §11.3/§11.4 定的下限是 300 —— 调低会明显掉识别率，别为了省时间动它。
    dpi: ${OCR_DPI:300}

    # 单页 OCR 超时（秒）。★ 必须有上限：一页 A4 CPU 约 1–5 秒（12 §11.1），
    #   但没有上限时一张异常大的图会把后台任务挂死，而界面上只看到"一直在跑"。
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:120}

    # 图像预处理（deskew 等）。12 §11.4 要求 deskew 必开（扫描件常有倾斜）。
    preprocess: ${OCR_PREPROCESS:true}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    cn.lincoln.aiplatform: DEBUG
  # 结构化 JSON 日志（Boot 3.4+ 内置，不引第三方 encoder：09 §10.1）。
  # 开发期保持关闭 —— 采集环境才需要它，本地读文本更省事。
  # structured:
  #   format:
  #     console: ecs
