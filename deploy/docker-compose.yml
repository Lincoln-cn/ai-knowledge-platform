# ════════════════════════════════════════════════════════════════════════════
#  交付形态（一条命令起）：应用 + PostgreSQL(pgvector/zhparser) + Ollama
# ════════════════════════════════════════════════════════════════════════════
#
#  ★ 与根目录 `docker-compose.yml` 的区别（**两份不是一个东西，别合并**）：
#    · 根目录那份 = **开发期**（只起 PG，应用在 IDE 里跑）—— 改代码不重建镜像；
#    · 这一份 = **交付期**（应用也进容器）—— 内网/单客户私有化，`docker compose up -d` 即可。
#    两件事的关注点相反，混在一起会让"改代码不重建镜像"这条开发便利消失（ROADMAP §4.6）。
#
#  ── 前置：两个镜像要先在**本机**构建好（内网机器上则是 `docker load` 导入）
#     docker build -f deploy/pg/Dockerfile -t ai-knowledge-platform-pg:dev .
#     backend/mvn-jdk25.cmd -B -f backend/pom.xml package -DskipTests
#     docker build -f deploy/Dockerfile -t ai-knowledge-platform:dev .
#
#  ── 起
#     # 必填一个不少于 32 字节的随机串（JWT 签名密钥），没有就起不来（刻意如此）
#     JWT_SECRET="$(openssl rand -base64 48)" docker compose -f deploy/docker-compose.yml up -d
#
#     # 第一次还要拉模型（否则"没有一个可用模型"，问答直接失败）
#     docker compose -f deploy/docker-compose.yml exec ollama ollama pull qwen2.5:3b
#     docker compose -f deploy/docker-compose.yml exec ollama ollama pull bge-m3
#
#  ── 验
#     curl -fsS http://127.0.0.1:8080/actuator/health   # status=UP，且 components.ocr / components.db
#     打开 http://127.0.0.1:8080  （应用自带前端静态产物）
#
#  ★ 为什么 `JWT_SECRET` 用 `:?` 而不是给默认值：application.yml 里那个默认值是
#    **开发用**的（注释写着 dev-only），交付形态里静默沿用它 = 所有部署共用一把钥匙。
#    这里选择"起不来"，因为"起不来"会在部署脚本里立刻被看见。
#
#  ★ 模型**不**在 compose 里自动拉：`ollama pull` 需要网络，而离线交付的场景恰恰没有网络
#    ⇒ 镜像（模型文件）要随交付包一起带，落地后 `ollama create` / 挂载 .ollama 卷。
# ════════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: ai-knowledge-platform-pg:dev
    container_name: aip-deliver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiplatform
      POSTGRES_USER: aiplatform
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aiplatform}
    volumes:
      - aip-pgdata:/var/lib/postgresql/data
    healthcheck:
      # ★ 用 pg_isready 而不是 `nc -z`：后者只证明端口开着，证明不了库已可接受查询。
      test: ["CMD-SHELL", "pg_isready -U aiplatform -d aiplatform"]
      interval: 5s
      timeout: 3s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    container_name: aip-deliver-ollama
    restart: unless-stopped
    volumes:
      # ★ 模型文件落在命名卷里，随容器生命周期保留；离线交付时把这个卷一起带走。
      - aip-ollama:/root/.ollama
    # ★ 有 GPU 时把下面两行注释去掉（需要宿主机装了 nvidia-container-toolkit）：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  app:
    image: ai-knowledge-platform:dev
    container_name: aip-deliver-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      # 容器内走服务名，不是 localhost —— 这是"一条命令起"最容易错的一格。
      DB_URL: jdbc:postgresql://postgres:5432/aiplatform
      DB_USER: aiplatform
      DB_PASSWORD: ${DB_PASSWORD:-aiplatform}
      AI_BASE_URL: http://ollama:11434/v1
      AI_API_KEY: ${AI_API_KEY:-ollama-local}
      JWT_SECRET: ${JWT_SECRET:?必须设置 JWT_SECRET（≥32 字节随机串）。见文件头"起"那一节}
      # 演示数据：交付默认关；做 POC 演示时置 true（见 docs/ROADMAP §11.10.28）
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  aip-pgdata:
  aip-ollama:
